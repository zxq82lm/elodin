timeout = "300s"
retries = 0
continue_on_error = true

[env]
# XLA backend: the grid workload trips a Cranelift codegen limit on arm64.
ELODIN_BACKEND = "jax-cpu"

[retention]
keep_run_db = "on-fail"

[hooks]
post_run = "examples/wildfire-aude/hooks/score.py"
post_campaign = "examples/wildfire-aude/hooks/report.py"
