[monte_carlo]
n_samples = 48
seed = 7
method = "lhs"

# Weather dispersion is anchored in the documented conditions (tramontane
# ~NW, gusts around 60 km/h, hot dry afternoon); model knobs are dispersed
# for calibration against the EFFIS scar; ignition jitter reflects the
# uncertainty of the documented start point (roadside D212).
[monte_carlo.variables]
wind_speed_kmh = { dist = "uniform", min = 42.0, max = 65.0 }
wind_from_deg = { dist = "normal", mean = 297.0, std = 8.0 }
gust_std = { dist = "uniform", min = 0.08, max = 0.30 }
fuel_moisture = { dist = "uniform", min = 0.06, max = 0.11 }
r0_scale = { dist = "uniform", min = 0.70, max = 1.05 }
k_wind = { dist = "uniform", min = 0.18, max = 0.27 }
spot_rate = { dist = "uniform", min = 0.05, max = 0.30 }
ignition_east_km = { dist = "normal", mean = 5.25, std = 0.4 }
ignition_north_km = { dist = "normal", mean = 15.15, std = 0.4 }
noise_seed = { dist = "uniform", min = 0.0, max = 1000000.0 }
